site_name: TAHADHARI Documentation
site_description: Developer documentation for TAHADHARI, an offline-first conservation intelligence and patrol prioritisation platform.
site_url: https://akirachix.github.io/CompilHER_Technical_Documentation/
repo_url: https://github.com/akirachix/CompilHER_Technical_Documentation
repo_name: CompilHER_Technical_Documentation


theme:
  name: material
  language: en
  logo: assets/brand/tahadhari-logo.png
  favicon: assets/brand/tahadhari-logo.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
  
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/architecture.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  

plugins:
  - search

nav:
  - Home: index.md
  - Overview: overview.md
  - Architecture: architecture.md
  - Backend: backend.md
  - AI and Prediction: ai.md
  - Frontend Web: frontend.md
  - Mobile: mobile.md
  - Integrations: integrations.md
  - Glossary: glossary.md

extra:
  generator: false

copyright: TAHADHARI &mdash; conservation intelligence for the field.
